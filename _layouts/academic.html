<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }} · Radar Perception &amp; Embodied AI">
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/profile-seaside.jpg' | absolute_url }}">
  {% include favicon.html %}
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if page.url == '/' %}<script src="{{ '/assets/js/legacy-links.js' | relative_url }}" defer></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Tingwei Chen home">Tingwei<span>.Chen</span></a>
    <nav aria-label="Main navigation">
      {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>
  <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
  <footer class="site-footer wrap">
    <span>© {{ site.time | date: '%Y' }} Tingwei Chen</span>
    <span>Radar perception &amp; embodied AI <span class="footer-dot" aria-hidden="true">·</span> Sydney, Australia</span>
    <a href="{{ '/' | relative_url }}">Home</a>
  </footer>
</body>
</html>
