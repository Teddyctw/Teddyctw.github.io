<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }} · AI &amp; Wireless Sensing">
  <meta property="og:description" content="{{ site.description | strip | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/profile小.jpg' | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Tingwei Chen home">tingwei<span>.chen</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="{{ '/' | relative_url }}#research">Research</a>
      <a href="{{ '/' | relative_url }}#publications">Publications</a>
      <a href="{{ '/' | relative_url }}#experience">Experience</a>
      <a href="{{ '/' | relative_url }}#contact">Contact</a>
    </nav>
  </header>
  <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
  <footer class="site-footer wrap">
    <span>© {{ site.time | date: '%Y' }} Tingwei Chen</span>
    <span>AI &amp; wireless sensing <span class="footer-dot" aria-hidden="true">·</span> Sydney, Australia</span>
    <a href="#main">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
